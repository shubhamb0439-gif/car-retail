# glassfix configuration: car photo -> transparent-background studio PNG with clean tinted glass (OpenAI).

openai:
  model: gpt-image-2.5-sunburst   # OpenAI's model for precise edits (docs, 2026-10); gpt-image-2.5-flare is faster
  quality: medium                 # low | medium | high  (measured ~$0.024 / $0.029 / $0.054 per photo, see README)
  send_max_side: 1536             # photos are downscaled to this before upload (output is ~1536x1024 anyway)
  concurrency: 3                  # photos processed in parallel (raise as your OpenAI rate limit allows)
  max_retries: 4                  # retries on rate limits / timeouts / server errors
  retry_backoff_seconds: 15       # wait 15 s, 30 s, 45 s, ... between retries
  timeout_seconds: 180

# Style example sent with every photo so all cars get the same look (adds ~$0.01 per photo).
# Set to "" to send the photo alone (cheaper, less consistent).
style_reference: assets/style_reference.png

prompt: >-
  Turn this car photo into a clean studio product image with a fully transparent background.
  Keep the car itself exactly the same: same model, shape, paint colour, wheels, badges, lights, trim and
  camera angle. Remove the background, the ground and all shadows. Even out the lighting on the car like a
  soft white studio. Replace every window with clean, slightly grey tinted glass that is semi-transparent,
  with no reflections of sky, trees or buildings; the car's interior (seats, headrests, steering wheel)
  stays faintly visible through it.
prompt_reference_suffix: >-
  The SECOND image is only a style example for the glass, lighting and transparent background. Never copy
  its car: the output must show the car from the FIRST image (same make, model, body type, colour and
  camera angle), even if the two cars are completely different.

# OpenAI GPT Image 2.5 token prices (USD per 1M tokens, pricing page 2026-10), used for the cost columns.
pricing_usd_per_million_tokens:
  image_input: 8.0
  text_input: 5.0
  image_output: 30.0
